[project]
name = "deezer2am"
version = "0.1.0"
description = "Import your Spotify playlists to Apple Music"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4==4.13.3",
    "dateparser==1.2.1",
    "loguru==0.7.3",
    "ratelimit==2.2.1",
    "requests==2.32.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "responses>=0.26.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
